    <script>
        let currentLang = localStorage.getItem('siteLang') || 'jp';
        let currentFilter = 'ALL';

        function htmlLangFor(lang) {
            if (lang === 'en') return 'en';
            if (lang === 'zh') return 'zh-Hant';
            return 'ja';
        }

        function init() {
            switchLang(currentLang);
        }

          function renderBlog() {
             const grid = document.getElementById('blog-grid');
    
            let activePosts = siteData.posts.filter(post => {
             if (post.langs && typeof post.langs[currentLang] === 'boolean' && !post.langs[currentLang]) return false;
             return post.title[currentLang] && post.title[currentLang] !== "";
            });

            activePosts.sort((a, b) => b.id - a.id);

             if (currentFilter !== 'ALL') {
             activePosts = activePosts.filter(post => post.tag === currentFilter);
             }

            if (activePosts.length === 0) {
                grid.innerHTML = `<div class="col-span-full text-center py-20 text-gray-500 font-mono">NO DATA AVAILABLE // <br> TRY ANOTHER CATEGORY</div>`;
                return;
            }

            grid.innerHTML = activePosts.map(post => `
                <a href="post.html?id=${post.id}" class="group block bg-white border border-transparent hover:border-gray-200 hover:shadow-xl transition-all duration-300 transform hover:-translate-y-1">
                    <div class="aspect-video overflow-hidden relative">
                        <img src="${post.img}" alt="${(post.title[currentLang] || post.tag || '').replace(/"/g, '&quot;')}" class="w-full h-full object-cover transition-transform duration-700 group-hover:scale-105">
                        <div class="absolute bottom-0 left-0 bg-black text-white text-xs px-2 py-1 font-mono">${(post.dates && post.dates[currentLang]) || post.date}</div>
                        <div class="absolute top-0 right-0 bg-tech-purple text-black text-[10px] font-bold px-2 py-1">${post.tag}</div>
                    </div>
                    <div class="p-5">
                        <h3 class="font-bold text-lg leading-tight group-hover:text-tech-purple transition-colors line-clamp-2 text-black">
                            ${post.title[currentLang]}
                        </h3>
                        <div class="mt-4 w-8 h-1 bg-gray-200 group-hover:bg-tech-purple transition-colors"></div>
                    </div>
                </a>
            `).join('');
        }

        function filterPosts(tag) {
            currentFilter = tag;
            document.querySelectorAll('.filter-btn').forEach(btn => {
                if(btn.dataset.filter === tag) {
                    btn.classList.add('active-filter');
                } else {
                    btn.classList.remove('active-filter');
                }
            });
            renderBlog();
        }

        function switchLang(lang) {
            currentLang = lang;
            localStorage.setItem('siteLang', lang);
            document.documentElement.lang = htmlLangFor(lang);
            document.getElementById('currentLangDisplay').innerText = lang.toUpperCase();
            const targetLink = lang === 'jp' ? 'store.html?region=JP' : lang === 'en' ? 'store.html?region=GL' : 'store.html';
            
            const dLink = document.getElementById('desktop-store-link'); if(dLink) { dLink.href = targetLink; dLink.target = '_self'; }
            const mLink = document.getElementById('mobile-store-link'); if(mLink) { mLink.href = targetLink; mLink.target = '_self'; }
            
            renderBlog();
            const langMenu = document.getElementById('langMenuDesktop');
            if(langMenu) langMenu.classList.remove('open');
        }

        function toggleDesktopLang() { document.getElementById('langMenuDesktop').classList.toggle('open'); }
        function toggleMobileMenu() { document.getElementById('mobileMenu').classList.toggle('translate-x-full'); }
        document.addEventListener('DOMContentLoaded', init);
    </script>
