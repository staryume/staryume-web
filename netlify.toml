[[headers]]
  for = "/*.js"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
    Netlify-CDN-Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    Content-Security-Policy = "default-src 'self'; base-uri 'self'; object-src 'none'; form-action 'self'; frame-ancestors 'none'; upgrade-insecure-requests; script-src 'self' 'unsafe-inline' https://cdn.tailwindcss.com https://cdn.jsdelivr.net https://www.googletagmanager.com https://www.google-analytics.com https://www.youtube.com https://s.ytimg.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://cdn.tailwindcss.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' https: data:; media-src 'self' https://www.youtube.com https://*.googlevideo.com; connect-src 'self' https://www.google-analytics.com https://analytics.google.com https://script.google.com https://script.googleusercontent.com https://get.geojs.io; frame-src 'self' https://www.youtube.com https://www.youtube-nocookie.com"

# Inject per-post Open Graph tags for Facebook / LINE / Discord crawlers
[[edge_functions]]
  function = "og-post"
  path = "/post.html"

# HK checkout order proxy (rate limit + forward to Apps Script)
[[edge_functions]]
  function = "hk-order"
  path = "/api/hk-order"

# Store region by visitor country (HK / TW)
[[edge_functions]]
  function = "geo"
  path = "/api/geo"

# Staff inventory + event POS (rate limit + proxy to Apps Script)
[[edge_functions]]
  function = "pos"
  path = "/api/pos"

# Private knowledge vault API: netlify/functions/kb.mjs (path set in the function)

[[headers]]
  for = "/kb.html"
  [headers.values]
    Cache-Control = "no-store"
    X-Robots-Tag = "noindex, nofollow"
    Referrer-Policy = "no-referrer"

[[headers]]
  for = "/kb-share.html"
  [headers.values]
    Cache-Control = "no-store"
    X-Robots-Tag = "noindex, nofollow"
    Referrer-Policy = "no-referrer"

# HK book form (require 流水號, forward to Apps Script)
[[edge_functions]]
  function = "hk-form"
  path = "/api/hk-form"

# FF47 booth backorder (returns auto serial to the form)
[[edge_functions]]
  function = "ff47-event-preorder"
  path = "/api/ff47-event-preorder"

# FF47 色紙 auction
[[edge_functions]]
  function = "auction"
  path = "/api/auction"

# Summer 2026 questionnaire (rate limit + proxy to Apps Script)
[[edge_functions]]
  function = "survey"
  path = "/api/survey"

[[headers]]
  for = "/survey.html"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

[[headers]]
  for = "/survey-dashboard.html"
  [headers.values]
    Cache-Control = "no-store"
    X-Robots-Tag = "noindex, nofollow"
