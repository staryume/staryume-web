[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    Content-Security-Policy = "default-src 'self'; base-uri 'self'; object-src 'none'; form-action 'self'; frame-ancestors 'none'; upgrade-insecure-requests; script-src 'self' 'unsafe-inline' https://cdn.tailwindcss.com https://cdn.jsdelivr.net https://www.googletagmanager.com https://www.google-analytics.com https://www.youtube.com https://s.ytimg.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://cdn.tailwindcss.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' https: data:; media-src 'self' https://www.youtube.com https://*.googlevideo.com; connect-src 'self' https://www.google-analytics.com https://analytics.google.com https://script.google.com https://script.googleusercontent.com; frame-src 'self' https://www.youtube.com https://www.youtube-nocookie.com"

# Inject per-post Open Graph tags for Facebook / LINE / Discord crawlers
[[edge_functions]]
  function = "og-post"
  path = "/post.html"

# HK checkout order proxy (rate limit + forward to Apps Script)
[[edge_functions]]
  function = "hk-order"
  path = "/api/hk-order"

# Store region by visitor country (HK / TW)
[[edge_functions]]
  function = "geo"
  path = "/api/geo"
