    function formEndpoint() {
      const host = location.hostname;
      if (host === 'localhost' || host === '127.0.0.1') return SCRIPT_URL_DIRECT;
      return API_URL;
    }

    const V = window.SurveyValidate;
    const scores = { q1: '', q2: '', q3: '', q4: '', q7: '' };

    function detectLang() {
      const params = new URLSearchParams(location.search);
      const q = (params.get('lang') || params.get('l') || '').toLowerCase();
      if (q === 'jp' || q === 'ja') return 'jp';
      if (q === 'zh' || q.indexOf('zh') === 0) return 'zh';
      try {
        const stored = (localStorage.getItem('siteLang') || '').toLowerCase();
        if (stored === 'jp' || stored === 'ja') return 'jp';
        if (stored === 'zh') return 'zh';
      } catch (_) {}
      return 'zh';
    }

    let lang = detectLang();

    function t() { return I18N[lang] || I18N.zh; }

    function selectedEvent() {
      if (lang === 'jp') return 'c108';
      const el = document.querySelector('input[name="event"]:checked');
      return el ? el.value : '';
    }

    function setLang(next, pushUrl) {
      lang = next === 'jp' ? 'jp' : 'zh';
      if (pushUrl) {
        const u = new URL(location.href);
        u.searchParams.set('lang', lang);
        history.replaceState({}, '', u);
      }
      applyI18n();
    }

    function scaleBlock(id, title) {
      return (
        '<fieldset data-scale="' + id + '">' +
          '<legend class="block text-sm font-bold mb-3">' + title + ' <span class="text-red-500">*</span></legend>' +
          '<div class="flex gap-2">' +
            [1, 2, 3, 4, 5].map(function (n) {
              return '<button type="button" class="likert-btn flex-1 py-3 border border-gray-200 rounded-xl text-sm font-bold bg-gray-50 hover:border-tech-purple transition" data-scale="' + id + '" data-value="' + n + '" aria-pressed="false">' + n + '</button>';
            }).join('') +
          '</div>' +
          '<div class="flex justify-between text-[10px] text-gray-400 mt-1.5 px-0.5">' +
            '<span>' + t().scaleLo + '</span><span>' + t().scaleHi + '</span>' +
          '</div>' +
          '<button type="button" class="likert-btn mt-2 text-xs px-3 py-2 border border-gray-200 rounded-lg text-gray-600 hover:border-tech-purple" data-scale="' + id + '" data-value="na" aria-pressed="false">' + t().na + '</button>' +
          '<label class="block text-xs text-gray-400 mt-3 mb-1">' + t().notes + '</label>' +
          '<textarea id="' + id + 'Notes" rows="2" maxlength="500" placeholder="' + t().notesPh + '" class="w-full border border-gray-200 rounded-xl px-3 py-2 text-sm bg-gray-50 focus:outline-none focus:ring-2 focus:ring-tech-purple focus:bg-white transition resize-y"></textarea>' +
          '<p id="err-' + id + '" class="hidden text-xs text-red-500 mt-2">' + t().errScore + '</p>' +
        '</fieldset>'
      );
    }

    function applyI18n() {
      const s = t();
      document.documentElement.lang = s.htmlLang;
      document.title = s.docTitle;
      document.getElementById('pageTitle').textContent = s.title;
      document.getElementById('pageLead').textContent = s.lead;
      document.getElementById('giftBox').textContent = s.gift;
      document.getElementById('eventLegend').innerHTML = s.eventLegend;
      document.getElementById('eventAcghkHint').textContent = s.eventAcghk;
      document.getElementById('eventFf47Hint').textContent = s.eventFf47;
      document.getElementById('err-event').textContent = s.errEvent;
      document.getElementById('q5Label').textContent = s.q5 + ' ' + s.optional;
      document.getElementById('q6Label').textContent = s.q6 + ' ' + s.optional;
      document.getElementById('q8Label').textContent = s.q8 + ' ' + s.optional;
      document.getElementById('q9Label').textContent = s.q9 + ' ' + s.optional;
      document.getElementById('q5').placeholder = s.shortPh;
      document.getElementById('q6').placeholder = s.shortPh;
      document.getElementById('q8').placeholder = s.shortPh;
      document.getElementById('q9').placeholder = s.longPh;
      document.getElementById('contactHead').textContent = s.contactHead;
      document.getElementById('handleLabel').textContent = s.handle;
      document.getElementById('snsTypeLabel').textContent = s.snsType;
      document.getElementById('snsContactLabel').textContent = s.snsContact;
      document.getElementById('emailLabel').textContent = s.email;
      document.getElementById('emailHint').textContent = s.emailHint;
      document.getElementById('err-email').textContent = s.errEmail;
      document.getElementById('submitBtn').textContent = s.submit;
      document.getElementById('successTitle').textContent = s.successTitle;
      document.getElementById('successBody').textContent = s.successBody;
      document.getElementById('successSerialLabel').textContent = s.serialLabel;
      document.getElementById('dupNote').textContent = s.dupNote;
      document.getElementById('mailWarn').textContent = s.mailWarn;
      document.getElementById('discordBlurb').textContent = s.discord;
      document.getElementById('homeLink').textContent = s.home;
      document.getElementById('closedBanner').textContent = s.closed;
      document.getElementById('configHint').textContent = s.config;
      document.getElementById('snsType').options[0].text = s.snsNone;

      document.getElementById('q1Wrap').innerHTML = scaleBlock('q1', s.q1);
      document.getElementById('q2Wrap').innerHTML = scaleBlock('q2', s.q2);
      document.getElementById('q3Wrap').innerHTML = scaleBlock('q3', s.q3);
      document.getElementById('q4Wrap').innerHTML = scaleBlock('q4', s.q4);
      document.getElementById('q7Wrap').innerHTML = scaleBlock('q7', s.q7);
      bindLikert();
      restoreLikertPressed();

      const jp = lang === 'jp';
      document.getElementById('eventField').classList.toggle('hidden', jp);
      document.getElementById('c108Badge').classList.toggle('hidden', !jp);
      document.getElementById('langZh').className = 'px-2 py-1 rounded-lg ' + (jp ? 'text-gray-400' : 'bg-black text-white');
      document.getElementById('langJp').className = 'px-2 py-1 rounded-lg ' + (jp ? 'bg-black text-white' : 'text-gray-400');
      toggleQ1();
    }

    function restoreLikertPressed() {
      Object.keys(scores).forEach(function (id) {
        if (!scores[id]) return;
        document.querySelectorAll('.likert-btn[data-scale="' + id + '"]').forEach(function (btn) {
          btn.setAttribute('aria-pressed', btn.getAttribute('data-value') === scores[id] ? 'true' : 'false');
        });
      });
    }

    function bindLikert() {
      document.querySelectorAll('.likert-btn').forEach(function (btn) {
        btn.addEventListener('click', function () {
          const id = btn.getAttribute('data-scale');
          const val = btn.getAttribute('data-value');
          scores[id] = val;
          document.querySelectorAll('.likert-btn[data-scale="' + id + '"]').forEach(function (b) {
            b.setAttribute('aria-pressed', b === btn ? 'true' : 'false');
          });
          showError(id, false);
        });
      });
    }

    function toggleQ1() {
      const show = selectedEvent() === 'ff47';
      document.getElementById('q1Wrap').classList.toggle('hidden', !show);
      if (!show) scores.q1 = '';
    }

    function showError(id, show) {
      const err = document.getElementById('err-' + id);
      const field = document.getElementById(id);
      if (err) err.classList.toggle('hidden', !show);
      if (field) field.classList.toggle('field-error', !!show);
    }

    function humanError(code) {
      const s = t();
      const map = {
        bad_email: s.errEmail,
        bad_event: s.errEvent,
        missing_score: s.errScore,
        bad_score: s.errScore,
        closed: s.closed,
        rate_limited: lang === 'jp' ? '送信が多すぎます。しばらくしてから再度お試しください。' : '提交次數過多，請稍後再試。',
        not_configured: s.config,
      };
      return map[code] || s.fail;
    }

    document.getElementById('langZh').addEventListener('click', function () { setLang('zh', true); });
    document.getElementById('langJp').addEventListener('click', function () { setLang('jp', true); });
    document.querySelectorAll('input[name="event"]').forEach(function (r) {
      r.addEventListener('change', function () {
        showError('event', false);
        toggleQ1();
      });
    });

    applyI18n();

    if (!formEndpoint()) {
      document.getElementById('configHint').classList.remove('hidden');
    }

    document.getElementById('surveyForm').addEventListener('submit', async function (ev) {
      ev.preventDefault();
      const s = t();
      const formError = document.getElementById('formError');
      const submitBtn = document.getElementById('submitBtn');
      formError.classList.add('hidden');
      ['event', 'email', 'q1', 'q2', 'q3', 'q4', 'q7'].forEach(function (id) { showError(id, false); });

      const event = selectedEvent();
      const payload = {
        action: 'submit',
        lang: lang,
        event: event,
        email: document.getElementById('email').value,
        handle: document.getElementById('handle').value,
        snsType: document.getElementById('snsType').value,
        snsContact: document.getElementById('snsContact').value,
        q1: { score: event === 'ff47' ? scores.q1 : '', notes: document.getElementById('q1Notes') ? document.getElementById('q1Notes').value : '' },
        q2: { score: scores.q2, notes: document.getElementById('q2Notes').value },
        q3: { score: scores.q3, notes: document.getElementById('q3Notes').value },
        q4: { score: scores.q4, notes: document.getElementById('q4Notes').value },
        q5: document.getElementById('q5').value,
        q6: document.getElementById('q6').value,
        q7: { score: scores.q7, notes: document.getElementById('q7Notes').value },
        q8: document.getElementById('q8').value,
        q9: document.getElementById('q9').value,
        website: document.getElementById('website').value,
      };

      const checked = V.validateSubmit(payload);
      if (!checked.ok) {
        if (checked.field) showError(checked.field, true);
        formError.textContent = humanError(checked.error);
        formError.classList.remove('hidden');
        return;
      }

      const endpoint = formEndpoint();
      if (!endpoint) {
        document.getElementById('configHint').classList.remove('hidden');
        return;
      }

      submitBtn.disabled = true;
      submitBtn.textContent = s.submitting;
      try {
        const res = await fetch(endpoint, {
          method: 'POST',
          redirect: 'follow',
          headers: { 'Content-Type': 'text/plain;charset=utf-8' },
          body: JSON.stringify(payload),
        });
        let result = null;
        try {
          const text = await res.text();
          if (text && text.trim().startsWith('{')) result = JSON.parse(text);
        } catch (_) {}

        if (!result || result.ok === false) {
          const err = (result && result.error) || 'fail';
          if (result && result.field) showError(result.field, true);
          if (err === 'closed') document.getElementById('closedBanner').classList.remove('hidden');
          formError.textContent = humanError(err);
          formError.classList.remove('hidden');
          submitBtn.disabled = false;
          submitBtn.textContent = s.submit;
          return;
        }

        document.getElementById('surveyForm').classList.add('hidden');
        document.getElementById('giftBox').classList.add('hidden');
        document.getElementById('successCard').classList.remove('hidden');
        document.getElementById('successSerial').textContent = result.serial || '—';
        if (result.duplicate) document.getElementById('dupNote').classList.remove('hidden');
        if (result.mailError || result.emailSent === false) document.getElementById('mailWarn').classList.remove('hidden');
      } catch (e) {
        formError.textContent = s.fail;
        formError.classList.remove('hidden');
        submitBtn.disabled = false;
        submitBtn.textContent = s.submit;
      }
    });
  </script>
</body>
</html>
