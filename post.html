    <script>
        let currentLang = localStorage.getItem('siteLang') || 'jp';

        function init() {
            document.getElementById('currentLangDisplay').innerText = currentLang.toUpperCase();
            loadPostData();
        }

        function loadPostData() {
            const params = new URLSearchParams(window.location.search);
            const postId = parseInt(params.get('id'));
            const post = siteData.posts.find(p => p.id === postId);

            if (post) {
                // --- SMART LANGUAGE FALLBACK ---
                if (!post.title[currentLang] || post.title[currentLang] === "") {
                    const availableLang = Object.keys(post.title).find(key => post.title[key] && post.title[key] !== "");
                    if (availableLang) {
                        currentLang = availableLang;
                        const noticeDiv = document.createElement('div');
                        noticeDiv.className = "bg-tech-purple text-black text-xs font-bold px-4 py-2 mb-8 text-center";
                        noticeDiv.innerHTML = `NOTE: This post is only available in ${availableLang.toUpperCase()}.`;
                        
                        const contentBox = document.getElementById('post-content');
                        contentBox.insertBefore(noticeDiv, contentBox.firstChild);
                    }
                }

                document.getElementById('post-date').innerText = post.date;
                document.getElementById('post-img').src = post.img;
                document.getElementById('post-tag').innerText = post.tag;
                document.getElementById('post-title').innerText = post.title[currentLang];
                document.getElementById('post-content').innerHTML += DOMPurify.sanitize(marked.parse(post.content[currentLang]));
                document.title = `${post.tag} | ${post.title[currentLang]}`;
            } else {
                document.getElementById('post-content').innerHTML = `
                    <div class="text-center py-20">
                        <h1 class="text-4xl font-bold text-black mb-4">404 // DATA MISSING</h1>
                        <a href="blog.html" class="text-tech-purple font-bold hover:underline">RETURN TO ARCHIVE</a>
                    </div>
                `;
                document.getElementById('post-title').innerText = "ERROR";
                document.getElementById('post-img').style.display = 'none';
            }
        }

        function switchLang(lang) {
            currentLang = lang;
            localStorage.setItem('siteLang', lang);
            document.getElementById('currentLangDisplay').innerText = lang.toUpperCase();
            const internalShop = "store.html";
            const boothShop = "https://staryume.booth.pm/"; 
            const isChinese = (lang === 'zh');
            const targetLink = isChinese ? internalShop : boothShop;
            const targetTarget = isChinese ? "_self" : "_blank"; 
            const dLink = document.getElementById('desktop-store-link'); if(dLink) { dLink.href = targetLink; dLink.target = targetTarget; }
            const mLink = document.getElementById('mobile-store-link'); if(mLink) { mLink.href = targetLink; mLink.target = targetTarget; }
            
            // Clear content before reloading to prevent duplicates
            document.getElementById('post-content').innerHTML = ''; 
            loadPostData(); 
            
            const langMenu = document.getElementById('langMenuDesktop');
            if(langMenu) langMenu.classList.remove('open');
        }

        function toggleDesktopLang() { document.getElementById('langMenuDesktop').classList.toggle('open'); }
        function toggleMobileMenu() { document.getElementById('mobileMenu').classList.toggle('translate-x-full'); }
        document.addEventListener('DOMContentLoaded', init);
    </script>
