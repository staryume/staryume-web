<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>QR generator | STARYUME</title>
  <meta name="robots" content="noindex, nofollow">
  <link rel="icon" type="image/svg+xml" href="./assets/coreimg/favicon.svg">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="./assets/vendor/qrcode.min.js"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: { 'tech-purple': '#D8B4FE', 'tech-black': '#0a0a0a' },
          fontFamily: { mono: ['ui-monospace', 'Menlo', 'monospace'] }
        }
      }
    }
  </script>
  <style>
    @media print {
      body { background: #fff !important; }
      .no-print { display: none !important; }
      #printSheet { display: grid !important; }
    }
  </style>
</head>
<body class="bg-gray-100 min-h-screen text-tech-black">
  <header class="no-print bg-tech-black text-white px-4 py-3 flex items-center justify-between">
    <p class="text-sm font-mono tracking-widest">staryume / qr generator</p>
    <a href="./index.html" class="text-xs text-tech-purple hover:underline">site</a>
  </header>

  <main class="no-print max-w-3xl mx-auto px-4 py-8 space-y-6">
    <p class="text-xs text-gray-500">Local staff tool. Paste a URL, download PNG, or print a sheet of numbered 流水號 codes. This page is not linked from the public site.</p>

    <section class="bg-white rounded-2xl border border-gray-200 p-5 space-y-4">
      <label class="block text-xs font-bold text-gray-500 uppercase">Content / URL</label>
      <textarea id="payload" rows="3" class="w-full border border-gray-200 rounded-xl px-3 py-2 font-mono text-sm bg-gray-50 focus:outline-none focus:ring-2 focus:ring-tech-purple"
        placeholder="https://staryu.me/auction.html">https://staryu.me/auction.html</textarea>

      <div class="flex flex-wrap gap-2">
        <button type="button" data-preset="https://staryu.me/auction.html" class="preset px-3 py-1.5 text-xs font-bold rounded-full bg-gray-100 hover:bg-tech-purple">Auction</button>
        <button type="button" data-preset="https://staryu.me/store.html" class="preset px-3 py-1.5 text-xs font-bold rounded-full bg-gray-100 hover:bg-tech-purple">Store</button>
        <button type="button" data-preset="https://staryu.me/hk-form.html" class="preset px-3 py-1.5 text-xs font-bold rounded-full bg-gray-100 hover:bg-tech-purple">HK form</button>
        <button type="button" data-preset="https://staryu.me/store.html?region=TW" class="preset px-3 py-1.5 text-xs font-bold rounded-full bg-gray-100 hover:bg-tech-purple">TW store</button>
      </div>

      <div class="grid grid-cols-2 md:grid-cols-4 gap-3">
        <div>
          <label class="block text-[10px] font-bold text-gray-400 mb-1">SIZE (px)</label>
          <select id="size" class="w-full border border-gray-200 rounded-lg px-2 py-2 text-sm">
            <option value="256">256</option>
            <option value="512" selected>512</option>
            <option value="768">768</option>
            <option value="1024">1024</option>
          </select>
        </div>
        <div>
          <label class="block text-[10px] font-bold text-gray-400 mb-1">MARGIN</label>
          <select id="margin" class="w-full border border-gray-200 rounded-lg px-2 py-2 text-sm">
            <option value="1">1</option>
            <option value="2" selected>2</option>
            <option value="4">4</option>
          </select>
        </div>
        <div class="col-span-2">
          <label class="block text-[10px] font-bold text-gray-400 mb-1">FILENAME</label>
          <input id="filename" type="text" value="qr-auction.png"
            class="w-full border border-gray-200 rounded-lg px-2 py-2 text-sm font-mono">
        </div>
      </div>

      <div class="flex flex-wrap gap-2">
        <button type="button" id="btnRender" class="px-4 py-2 bg-tech-black text-white text-sm font-bold rounded-lg hover:bg-gray-800">Generate</button>
        <button type="button" id="btnDownload" class="px-4 py-2 bg-tech-purple text-black text-sm font-bold rounded-lg hover:bg-purple-300">Download PNG</button>
      </div>

      <div class="flex justify-center bg-gray-50 rounded-xl p-4 border border-gray-100">
        <div id="qrBox" class="bg-white inline-block p-2"></div>
      </div>
    </section>

    <section class="bg-white rounded-2xl border border-gray-200 p-5 space-y-4">
      <h2 class="text-sm font-bold">Batch 流水號 (print sheet)</h2>
      <p class="text-xs text-gray-500">Uses <code class="bg-gray-100 px-1">{n}</code> in the URL. Example: <code class="bg-gray-100 px-1 text-[11px]">https://staryu.me/hk-form.html?serial={n}</code></p>
      <input id="batchTpl" type="text" value="https://staryu.me/hk-form.html?serial={n}"
        class="w-full border border-gray-200 rounded-lg px-3 py-2 text-sm font-mono">
      <div class="grid grid-cols-2 md:grid-cols-4 gap-3">
        <div>
          <label class="block text-[10px] font-bold text-gray-400 mb-1">FROM</label>
          <input id="fromN" type="number" value="1" min="1" class="w-full border border-gray-200 rounded-lg px-2 py-2 text-sm">
        </div>
        <div>
          <label class="block text-[10px] font-bold text-gray-400 mb-1">TO</label>
          <input id="toN" type="number" value="20" min="1" class="w-full border border-gray-200 rounded-lg px-2 py-2 text-sm">
        </div>
        <div>
          <label class="block text-[10px] font-bold text-gray-400 mb-1">PAD</label>
          <input id="padN" type="number" value="3" min="1" max="6" class="w-full border border-gray-200 rounded-lg px-2 py-2 text-sm">
        </div>
        <div class="flex items-end">
          <button type="button" id="btnBatch" class="w-full px-3 py-2 bg-tech-black text-white text-sm font-bold rounded-lg">Print sheet</button>
        </div>
      </div>
    </section>
  </main>

  <div id="printSheet" class="hidden print:grid grid-cols-3 gap-6 p-6"></div>

  <script>
    const box = document.getElementById('qrBox');

    function currentText() {
      return document.getElementById('payload').value.trim();
    }

    function drawQr(el, text, size) {
      el.innerHTML = '';
      new QRCode(el, {
        text: text,
        width: size,
        height: size,
        colorDark: '#0a0a0a',
        colorLight: '#ffffff',
        correctLevel: QRCode.CorrectLevel.M
      });
    }

    function pngFrom(el) {
      const c = el.querySelector('canvas');
      if (c) return c.toDataURL('image/png');
      const img = el.querySelector('img');
      return img ? img.src : '';
    }

    function render() {
      const text = currentText();
      if (!text) return;
      if (typeof QRCode === 'undefined') {
        alert('QR library failed to load. Refresh the page.');
        return;
      }
      const size = Number(document.getElementById('size').value) || 512;
      drawQr(box, text, size);
    }

    function downloadPng() {
      render();
      const href = pngFrom(box);
      if (!href) return;
      const name = (document.getElementById('filename').value || 'qr.png').replace(/[^\w.\-]+/g, '-');
      const a = document.createElement('a');
      a.href = href;
      a.download = name.endsWith('.png') ? name : (name + '.png');
      a.click();
    }

    document.querySelectorAll('.preset').forEach((btn) => {
      btn.addEventListener('click', () => {
        const url = btn.dataset.preset;
        document.getElementById('payload').value = url;
        const slug = url.replace(/^https?:\/\/staryu\.me\//, '').replace(/[^\w]+/g, '-') || 'qr';
        document.getElementById('filename').value = 'qr-' + slug + '.png';
        render();
      });
    });

    document.getElementById('btnRender').addEventListener('click', render);
    document.getElementById('btnDownload').addEventListener('click', downloadPng);
    document.getElementById('payload').addEventListener('change', render);
    document.getElementById('size').addEventListener('change', render);

    document.getElementById('btnBatch').addEventListener('click', () => {
      const tpl = document.getElementById('batchTpl').value;
      const from = Number(document.getElementById('fromN').value) || 1;
      const to = Number(document.getElementById('toN').value) || from;
      const pad = Number(document.getElementById('padN').value) || 3;
      if (to < from || to - from > 199) {
        alert('Range must be from ≤ to, and at most 200 codes.');
        return;
      }
      const sheet = document.getElementById('printSheet');
      sheet.innerHTML = '';
      sheet.classList.remove('hidden');
      for (let n = from; n <= to; n++) {
        const serial = String(n).padStart(pad, '0');
        const url = tpl.split('{n}').join(serial);
        const cell = document.createElement('div');
        cell.className = 'border border-gray-200 rounded-lg p-3 text-center break-inside-avoid';
        const holder = document.createElement('div');
        holder.className = 'inline-block';
        drawQr(holder, url, 180);
        const label = document.createElement('p');
        label.className = 'mt-2 text-sm font-mono font-bold';
        label.textContent = serial;
        const small = document.createElement('p');
        small.className = 'text-[9px] text-gray-400 break-all';
        small.textContent = url;
        cell.appendChild(holder);
        cell.appendChild(label);
        cell.appendChild(small);
        sheet.appendChild(cell);
      }
      window.print();
    });

    render();
  </script>
</body>
</html>
