    <script>
        let currentRegion = 'TW';
        let currentLang = 'zh';
        let cart = {};
        let currentImgIndex = 0;
        let currentProductImgs = [];
        let showOutOfStock = true; 

        document.addEventListener('DOMContentLoaded', () => {
            if (typeof storeConfig === 'undefined') { alert("Error: store.js missing"); return; }
            window.toggleDesktopLang = () => document.getElementById('langMenuDesktop').classList.toggle('open');
            window.toggleMobileMenu = () => document.getElementById('mobileMenu').classList.toggle('translate-x-full');
            window.switchLang = (l) => { currentLang = l; renderCategories(); renderAllSections(); document.getElementById('langMenuDesktop').classList.remove('open'); };

            // --- CHECK SHOP STATUS ---
            if (storeConfig.shopStatus && storeConfig.shopStatus.isOpen === false) {
                const banner = document.getElementById('shop-closed-banner');
                const text = document.getElementById('shop-next-date');
                if(banner && text) {
                    banner.classList.remove('hidden');
                    text.innerText = storeConfig.shopStatus.nextOpenDate;
                }
            }

            renderCategories();
            renderAllSections();
            
            document.getElementById('store-search').addEventListener('input', (e) => {
                const val = e.target.value.toLowerCase();
                if(val) handleSearch(val); else renderAllSections();
            });

            const imgContainer = document.querySelector('#modal-img').parentElement;
            let touchStartX = 0;
            imgContainer.addEventListener('touchstart', e => touchStartX = e.changedTouches[0].screenX, {passive: true});
            imgContainer.addEventListener('touchend', e => {
                if (e.changedTouches[0].screenX < touchStartX - 50) changeImage(1); 
                if (e.changedTouches[0].screenX > touchStartX + 50) changeImage(-1); 
            }, {passive: true});
        });

        // --- STOCK TOGGLE ---
        function toggleStock() {
            showOutOfStock = !showOutOfStock;
            const btn = document.getElementById('btn-stock');
            const dot = document.getElementById('btn-stock-dot');
            
            // If TRUE (Show Sold Out) -> Purple
            if(showOutOfStock) {
                btn.className = "relative inline-flex h-5 w-9 items-center rounded-full bg-tech-purple transition-colors flex-shrink-0";
                dot.className = "inline-block h-3 w-3 transform rounded-full bg-white transition shadow translate-x-5";
            } 
            // If FALSE (Hide Sold Out) -> Gray
            else {
                btn.className = "relative inline-flex h-5 w-9 items-center rounded-full bg-gray-300 transition-colors flex-shrink-0";
                dot.className = "inline-block h-3 w-3 transform rounded-full bg-white transition shadow translate-x-1";
            }
            renderAllSections();
        }

        function renderCategories() {
            const container = document.getElementById('category-tabs');
            container.innerHTML = storeConfig.categories.map(cat => {
                const catName = cat.name[currentLang] || cat.name.en || cat.name.zh || cat.id;
                return `<button onclick="scrollToCategory('${cat.id}')" class="px-5 py-2 text-sm font-bold text-gray-500 hover:text-black hover:bg-gray-200 rounded-full transition-colors whitespace-nowrap">${catName}</button>`;
            }).join('');
        }

        function renderAllSections() {
            const container = document.getElementById('store-container');
            container.innerHTML = ''; 
            
            storeConfig.categories.forEach(cat => {
                const items = storeProducts.filter(p => {
                    if (!p.category.includes(cat.id)) return false;
                    if (p.regions && !p.regions.includes(currentRegion)) return false;
                    if (!showOutOfStock && p.isSoldOut) return false;
                    if (p.langs && typeof p.langs[currentLang] === 'boolean' && !p.langs[currentLang]) return false;
                    return true;
                });

                if (items.length === 0) return;

                const section = document.createElement('div');
                section.id = `cat-${cat.id}`;
                section.className = "border-b border-gray-200 pb-6 last:border-0";
                
                section.innerHTML = `
                    <div class="flex justify-between items-center mb-6 px-2">
                        <h3 class="text-2xl font-bold flex items-center gap-3">
                            <span class="w-1.5 h-6 bg-tech-purple block"></span>
                            ${cat.name[currentLang] || cat.name.en || cat.name.zh || cat.id}
                        </h3>
                    </div>`;

                const listId = `list-${cat.id}`;
                const list = document.createElement('div');
                list.id = listId;
                list.className = "grid grid-cols-2 md:grid-cols-4 lg:grid-cols-5 gap-x-4 gap-y-10 transition-all duration-500";
                
                list.innerHTML = items.map((product, index) => {
                    const hiddenClass = index >= 4 ? 'hidden' : ''; 
                    return renderCard(product, hiddenClass);
                }).join('');
                
                section.appendChild(list);

                if (items.length > 4) { 
                    const btnContainer = document.createElement('div');
                    btnContainer.className = "flex justify-end mt-4"; 
                    btnContainer.innerHTML = `
                        <button onclick="revealItems('${listId}', this)" 
                                class="px-6 py-2 bg-tech-purple text-black text-sm font-tech font-bold border border-tech-purple hover:bg-white hover:text-purple transition-all shadow-sm">
                            MORE 更多...
                        </button>`;
                    section.appendChild(btnContainer);
                }
                container.appendChild(section);
            });
        }

        function renderCard(product, hiddenClass = '') {
            const price = (currentRegion === 'TW') ? `NT$ ${product.priceTW}` : `HKD$ ${product.priceHK}`;
            const title = product.title[currentLang] || product.title.en || product.title.zh || product.title.jp || '';
            const thumb = (product.imgs && product.imgs.length > 0) ? product.imgs[0] : product.img; 
            
            let badge = '';
            if (product.isSoldOut) badge = `<div class="absolute inset-0 bg-black/60 z-20 flex items-center justify-center"><span class="bg-black text-tech-purple -rotate-12 px-3 py-1 font-bold text-sm border-2 border-tech-purple shadow-lg">SOLD OUT</span></div>`;
            else if (product.isNew) badge = `<div class="absolute top-0 left-0 bg-tech-purple text-black text-[10px] font-bold px-2 py-1 z-10 shadow-md">NEW</div>`;

            return `
            <div onclick="openModal(${product.id})" class="group cursor-pointer flex flex-col h-full ${hiddenClass}">
                <div class="aspect-square relative bg-gray-100 rounded-lg overflow-hidden mb-3 shadow-sm hover:shadow-md transition-shadow">
                    <img src="${thumb}" loading="lazy" class="w-full h-full object-cover transition-transform duration-500 group-hover:scale-110">
                    ${badge}
                    <div class="absolute bottom-0 left-0 bg-black/90 text-white text-xs md:text-sm font-bold px-3 py-1 rounded-tr-lg z-10 font-mono">${price}</div>
                </div>
                <h4 class="text-sm font-bold text-black leading-snug group-hover:text-tech-purple transition-colors line-clamp-2 mt-1">${title}</h4>
            </div>`;
        }

        function revealItems(listId, btn) {
            const list = document.getElementById(listId);
            const hiddenItems = list.querySelectorAll('.hidden');
            hiddenItems.forEach(item => item.classList.remove('hidden'));
            btn.parentElement.remove(); 
        }

        function handleSearch(query) {
            const container = document.getElementById('store-container');
            const results = storeProducts.filter(p => {
                if (p.regions && !p.regions.includes(currentRegion)) return false;
                if (p.langs && typeof p.langs[currentLang] === 'boolean' && !p.langs[currentLang]) return false;
                const hay = [p.title?.jp, p.title?.en, p.title?.zh].filter(Boolean).join(' ').toLowerCase();
                return hay.includes(query.toLowerCase());
            });
            container.innerHTML = `
                <div class="py-8">
                    <h3 class="text-xl font-bold mb-6">Results for "${query}"</h3>
                    <div class="grid grid-cols-2 md:grid-cols-5 gap-4">
                        ${results.length ? results.map(p => renderCard(p)).join('') : '<p class="text-gray-400">No items found.</p>'}
                    </div>
                </div>`;
        }

        function openModal(id) {
            const product = storeProducts.find(p => p.id === id);
            if (!product) return;
            const modal = document.getElementById('product-modal');
            const price = (currentRegion === 'TW') ? `NT$ ${product.priceTW}` : `HKD$ ${product.priceHK}`;
            
            currentImgIndex = 0;
            currentProductImgs = product.imgs || [product.img];
            updateCarousel(); 

            document.getElementById('modal-title').innerText = product.title[currentLang] || product.title.en || product.title.zh || product.title.jp || '';
            document.getElementById('modal-price').innerText = price;
            document.getElementById('modal-desc').innerHTML = product.desc[currentLang] || product.desc.en || product.desc.zh || product.desc.jp || '';
            
            // --- UPDATED BADGES: ID REMOVED ---
            const badges = document.getElementById('modal-badges');
            badges.innerHTML = '';
            if(product.isNew) badges.innerHTML += `<span class="bg-tech-purple text-black text-xs font-bold px-2 py-1 rounded">NEW ARRIVAL</span>`;
            
            const actions = document.getElementById('modal-actions');
            
            // Logic for buttons (Shop Closed / Sold Out / Buy)
            if (storeConfig.shopStatus && storeConfig.shopStatus.isOpen === false) {
                actions.innerHTML = `<button disabled class="w-full bg-gray-200 text-gray-500 font-bold py-4 rounded-lg cursor-not-allowed">SHOP CLOSED / 目前關閉中</button>`;
            } else if (product.isSoldOut) {
                actions.innerHTML = `<button disabled class="w-full bg-gray-200 text-gray-400 font-bold py-4 rounded-lg cursor-not-allowed">SOLD OUT</button>`;
            } else if (currentRegion === 'TW') {
                actions.innerHTML = `<a href="${product.linkTW}" target="_blank" rel="noopener noreferrer" class="block w-full bg-tech-purple text-black text-center font-bold py-4 rounded-lg hover:bg-black hover:text-white transition-colors shadow-lg">BUY NOW (7-11 MYSHIP)</a>`;
            } else {
                actions.innerHTML = `<button onclick="addToCart(${product.id})" class="block w-full bg-black text-white font-bold py-4 rounded-lg hover:bg-tech-purple hover:text-black transition-colors shadow-lg">ADD TO CART</button>`;
            }
            modal.classList.remove('hidden');
        }

        function updateCarousel() {
            document.getElementById('modal-img').src = currentProductImgs[currentImgIndex];
            const prev = document.getElementById('prev-btn');
            const next = document.getElementById('next-btn');
            if (currentProductImgs.length > 1) { prev.classList.remove('hidden'); next.classList.remove('hidden'); } else { prev.classList.add('hidden'); next.classList.add('hidden'); }
            document.getElementById('image-dots').innerHTML = currentProductImgs.map((_, idx) => `<div class="w-2 h-2 rounded-full transition-colors ${idx === currentImgIndex ? 'bg-black' : 'bg-gray-300'}"></div>`).join('');
        }

        function changeImage(dir) {
            currentImgIndex += dir;
            if (currentImgIndex < 0) currentImgIndex = currentProductImgs.length - 1;
            if (currentImgIndex >= currentProductImgs.length) currentImgIndex = 0;
            updateCarousel();
        }

        function closeModal() { document.getElementById('product-modal').classList.add('hidden'); }

        function toggleExpand(listId, btn) {
            const list = document.getElementById(listId);
            if (list.classList.contains('max-h-[520px]')) { list.classList.remove('max-h-[520px]'); list.classList.remove('overflow-hidden'); btn.innerText = "SHOW LESS"; } 
            else { list.classList.add('max-h-[520px]'); list.classList.add('overflow-hidden'); btn.innerText = "SHOW MORE"; list.scrollIntoView({ behavior: 'smooth', block: 'center' }); }
        }
        function scrollToCategory(id) {
            const el = document.getElementById(`cat-${id}`);
            if(el) { const offset = 180; window.scrollTo({ top: el.getBoundingClientRect().top + window.pageYOffset - offset, behavior: "smooth" }); }
        }

        function setRegion(region) {
            currentRegion = region;
            
            // --- FIX: RENDER PRODUCTS FIRST (Ensures Price Updates) ---
            const searchVal = document.getElementById('store-search').value;
            if(searchVal) handleSearch(searchVal); else renderAllSections();

            // --- THEN UPDATE UI/BUTTONS ---
            const btnTw = document.getElementById('btn-tw');
            const btnHk = document.getElementById('btn-hk');
            const notice = document.getElementById('region-notice');
            const shipText = document.getElementById('shipping-text');

            if(region === 'TW') {
                if(btnTw) btnTw.className = "px-4 py-1 text-xs font-bold rounded transition-colors bg-tech-purple text-black shadow-sm";
                if(btnHk) btnHk.className = "px-4 py-1 text-xs font-bold rounded transition-colors text-gray-500 hover:text-black";
                if(notice) notice.innerText = "PAYMENT: 7-11 MYSHIP / 賣貨便到付";
                if(shipText) shipText.innerText = "Taiwan orders: Shipped via 7-11 Myship.";
            } else {
                if(btnTw) btnTw.className = "px-4 py-1 text-xs font-bold rounded transition-colors text-gray-500 hover:text-black";
                if(btnHk) btnHk.className = "px-4 py-1 text-xs font-bold rounded transition-colors bg-tech-purple text-black shadow-sm";
                if(notice) notice.innerText = "PAYMENT: PAYME · FPS · SF COD / 順豐站到付";
                if(shipText) shipText.innerText = "Hong Kong orders: Shipped via SF Express (Pay on Delivery).";
            }

            const cartBar = document.getElementById('cart-bar');
            if(cartBar) {
                if (currentRegion === 'HK' && Object.keys(cart).length > 0) cartBar.classList.remove('translate-y-full'); 
                else cartBar.classList.add('translate-y-full');
            }
        }
        
        function addToCart(id) { if(!cart[id]) cart[id] = 0; cart[id]++; updateCartUI(); closeModal(); document.getElementById('cart-bar').classList.remove('translate-y-full'); }
        function clearCart() { cart = {}; updateCartUI(); document.getElementById('cart-bar').classList.add('translate-y-full'); }
        function updateCartUI() { let total = 0; Object.keys(cart).forEach(id => { const item = storeProducts.find(p => p.id == id); if(item) total += item.priceHK * cart[id]; }); document.getElementById('cart-total').innerText = `HKD$ ${total}`; }
        function checkoutHK() {
            let orderText = "ORDER SUMMARY (HK):\n"; let total = 0;
            Object.keys(cart).forEach(id => { const item = storeProducts.find(p => p.id == id); if(item) { orderText += `- ${item.title.en} (x${cart[id]}) @ $${item.priceHK * cart[id]}\n`; total += item.priceHK * cart[id]; }});
            if(total === 0) return; orderText += `\nTOTAL HKD: $${total}`;
            if(confirm(`Total HKD $${total}. Proceed?`)) window.open(`${GOOGLE_FORM_URL}?usp=pp_url&${GOOGLE_ENTRY_ID}=${encodeURIComponent(orderText)}`, '_blank');
        }
    </script>
</body>
</html>
