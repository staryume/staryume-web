    <div id="lightbox" class="fixed inset-0 bg-black/95 z-[100] hidden flex items-center justify-center p-4" onclick="this.classList.add('hidden')"><img id="lightbox-img" src="" class="max-w-full max-h-full object-contain border border-white/20 shadow-2xl"></div>

    <script>
        let currentLang = localStorage.getItem('siteLang') || 'jp';
        let currentFilter = 'ALL';

        function init() {
            switchLang(currentLang);
            document.addEventListener('keydown', (e) => {
                if (e.key === 'Escape') {
                    const lb = document.getElementById('lightbox');
                    if (lb && !lb.classList.contains('hidden')) lb.classList.add('hidden');
                }
            });
        }

        function htmlLangFor(lang) {
            if (lang === 'en') return 'en';
            if (lang === 'zh') return 'zh-Hant';
            return 'ja';
        }

        function renderGallery() {
            const grid = document.getElementById('gallery-grid');
            const filtered = currentFilter === 'ALL' ? siteData.gallery : siteData.gallery.filter(item => item.tag === currentFilter);

            if (filtered.length === 0) { grid.innerHTML = `<div class="text-center text-gray-400 py-20 w-full break-inside-avoid">NO DATA</div>`; return; }

            // REMOVED "VIEW" TEXT below
            grid.innerHTML = filtered.map(item => `
                <div class="break-inside-avoid group relative cursor-pointer mb-4" onclick="openLightbox('${item.src}')">
                    <img src="${item.src}" alt="${item.tag || 'Gallery'}" class="w-full h-auto transition-transform duration-500 group-hover:scale-105 border border-transparent group-hover:border-tech-purple">
                    <div class="absolute inset-0 bg-tech-purple/90 opacity-0 group-hover:opacity-100 transition-opacity duration-300 flex items-center justify-center mix-blend-multiply"></div>
                    <div class="absolute bottom-2 left-2 bg-black text-white text-[10px] px-2 py-0.5 font-bold opacity-0 group-hover:opacity-100 transition-opacity duration-300">${item.tag}</div>
                </div>
            `).join('');
        }

        function filterGallery(tag) {
            currentFilter = tag;
            document.querySelectorAll('.filter-btn').forEach(btn => {
                if(btn.dataset.filter === tag) {
                    btn.classList.add('text-black', 'border-b-2', 'border-tech-purple');
                    btn.classList.remove('text-gray-400');
                } else {
                    btn.classList.remove('text-black', 'border-b-2', 'border-tech-purple');
                    btn.classList.add('text-gray-400');
                }
            });
            renderGallery();
        }

        function openLightbox(src) { document.getElementById('lightbox-img').src = src; document.getElementById('lightbox').classList.remove('hidden'); }
        
         // Language Switching
        function switchLang(lang) {
            currentLang = lang;
            localStorage.setItem('siteLang', lang);
            document.documentElement.lang = htmlLangFor(lang);
            
            // 1. Update Language Display
            const displayEl = document.getElementById('currentLangDisplay');
            if(displayEl) displayEl.innerText = lang.toUpperCase();

            // 2. SMART LINK LOGIC (Updated)
            const internalShop = "store.html";
            const boothShop = "https://staryume.booth.pm/"; 
            
            // CHECK: Is it Chinese?
            const isChinese = (lang === 'zh');

            // IF Chinese -> Internal Shop. ELSE (JP/EN) -> BOOTH
            const targetLink = isChinese ? internalShop : boothShop;
            
            // IF Chinese -> Same Tab. ELSE -> New Tab
            const targetTarget = isChinese ? "_self" : "_blank"; 

            // Update Desktop Link
            const desktopLink = document.getElementById('desktop-store-link');
            if(desktopLink) {
                desktopLink.href = targetLink;
                desktopLink.target = targetTarget;
            }

            // Update Mobile Link
            const mobileLink = document.getElementById('mobile-store-link');
            if(mobileLink) {
                mobileLink.href = targetLink;
                mobileLink.target = targetTarget;
            }

            // 3. Update Page Content (Existing Logic)
            if(typeof siteData !== 'undefined' && siteData.translations) {
                 const textData = siteData.translations[lang];
                 if(textData) {
                     document.querySelectorAll('[data-key]').forEach(el => {
                         const key = el.getAttribute('data-key');
                         if (textData[key]) el.innerHTML = textData[key];
                     });
                 }
            }

            // Re-render grids if functions exist
            if(typeof renderShop === 'function') renderShop();
            if(typeof renderBlog === 'function') renderBlog();
            if(typeof renderGallery === 'function') renderGallery();
            if(typeof loadPostData === 'function') loadPostData(); // For post.html

            // Close menu
            const langMenu = document.getElementById('langMenuDesktop');
            if(langMenu) langMenu.classList.remove('open');
        }

        // UI Toggles
        function toggleDesktopLang() { document.getElementById('langMenuDesktop').classList.toggle('open'); }
        function toggleMobileMenu() { document.getElementById('mobileMenu').classList.toggle('translate-x-full'); }

        // Run Init
        document.addEventListener('DOMContentLoaded', init);
    </script>
